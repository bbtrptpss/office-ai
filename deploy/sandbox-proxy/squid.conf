# Package registries a repository's setup command may download from. Add a host here to allow another one.
acl registries dstdomain registry.npmjs.org registry.yarnpkg.com api.nuget.org globalcdn.nuget.org
acl https port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https
http_access allow registries
http_access deny all

http_port 3128
cache deny all
pid_filename none
visible_hostname sandbox-proxy
forwarded_for delete
# Squid drops to its own user, which cannot open the container's stdout. Requests that are refused still fail visibly in the setup output.
access_log none
cache_log /var/log/squid/cache.log
