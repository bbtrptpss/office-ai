# Local development stack: PostgreSQL + API + web.
# Values below are development defaults; override them in a .env file (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: officeai
      POSTGRES_USER: officeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-officeai_dev}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeai -d officeai"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=officeai;Username=officeai;Password=${POSTGRES_PASSWORD:-officeai_dev}
      Database__MigrateOnStartup: "true"
      Cors__Origins__0: http://localhost:3000
      Seed__CeoEmail: ${CEO_EMAIL:-ceo@officeai.local}
      Seed__CeoPassword: ${CEO_PASSWORD:-ChangeMe-Dev-2026}
      Seed__CeoName: ${CEO_NAME:-CEO}
      # Claude is used only when a key is supplied. The simulated provider is for this local dev stack only.
      AiProviders__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AiProviders__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AiProviders__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Tokens for GitHub/GitLab remotes; a repository names the variable it uses (GIT_REMOTE_* only).
      GIT_REMOTE_GITHUB: ${GIT_REMOTE_GITHUB:-}
      GIT_REMOTE_GITLAB: ${GIT_REMOTE_GITLAB:-}
      AiProviders__Simulated__Enabled: ${SIMULATED_AI:-true}
      Repositories__Root: /data/repos
      Sandbox__RunnerUrl: http://sandbox-runner:8080
      Sandbox__RunnerToken: ${SANDBOX_RUNNER_TOKEN:-dev-runner-token}
    volumes:
      - repos:/data/repos
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      sandbox-runner:
        condition: service_started

  # Owns the Docker socket so the API never does. Not published to the host.
  sandbox-runner:
    build:
      context: ./backend
      target: runner
    environment:
      Repositories__Root: /data/repos
      Sandbox__UseLocalDocker: "true"
      Sandbox__RunnerToken: ${SANDBOX_RUNNER_TOKEN:-dev-runner-token}
      Sandbox__WorkspaceMount: "volume:officeai-repos:"
    volumes:
      - repos:/data/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_MASCOT_IMAGE: ${MASCOT_IMAGE:-}
        NEXT_PUBLIC_STAGE_IMAGE: ${STAGE_IMAGE:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  repos:
    name: officeai-repos
