# Local development stack: PostgreSQL + API + web.
# Values below are development defaults; override them in a .env file (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: officeai
      POSTGRES_USER: officeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-officeai_dev}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeai -d officeai"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=officeai;Username=officeai;Password=${POSTGRES_PASSWORD:-officeai_dev}
      Database__MigrateOnStartup: "true"
      Cors__Origins__0: http://localhost:3000
      Seed__CeoEmail: ${CEO_EMAIL:-ceo@officeai.local}
      Seed__CeoPassword: ${CEO_PASSWORD:-ChangeMe-Dev-2026}
      Seed__CeoName: ${CEO_NAME:-CEO}
      # Claude is used only when a key is supplied. The simulated provider is for this local dev stack only.
      AiProviders__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AiProviders__Simulated__Enabled: ${SIMULATED_AI:-true}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_MASCOT_IMAGE: ${MASCOT_IMAGE:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
